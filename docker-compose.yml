services:
  postgres:
    image: postgres:16-alpine
    profiles: ["postgres"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-carmen}
      POSTGRES_USER: ${POSTGRES_USER:-carmen}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in environment}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/db/postgres-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-carmen} -d ${POSTGRES_DB:-carmen}"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgbouncer:
    image: edoburu/pgbouncer:v1.23.1-p3
    profiles: ["postgres"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-carmen}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in environment}
      DB_NAME: ${POSTGRES_DB:-carmen}
      POOL_MODE: ${PGBOUNCER_POOL_MODE:-transaction}
      MAX_CLIENT_CONN: ${PGBOUNCER_MAX_CLIENT_CONN:-200}
      DEFAULT_POOL_SIZE: ${PG_POOL_MAX:-20}
      SERVER_IDLE_TIMEOUT: 30
      AUTH_TYPE: scram-sha-256
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-p", "5432", "-U", "${POSTGRES_USER:-carmen}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    profiles: ["redis"]
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      NODE_ENV: production
      PORT: 8080
      APP_URL: ${APP_URL:-https://localhost}
      PREVIEW_ORIGIN: ${PREVIEW_ORIGIN:-}
      ENCRYPTION_SECRET: ${ENCRYPTION_SECRET:?Set ENCRYPTION_SECRET (32+ random chars)}
      CARMEN_MASTER_KEY: ${CARMEN_MASTER_KEY:-}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET (32+ random chars)}
      CARMEN_DB_PATH: /app/data/carmen.db
      CARMEN_DB_DRIVER: ${CARMEN_DB_DRIVER:-sqlite}
      DATABASE_URL: ${DATABASE_URL:-}
      PG_POOL_MAX: ${PG_POOL_MAX:-20}
      PG_IDLE_TIMEOUT_MS: ${PG_IDLE_TIMEOUT_MS:-30000}
      PGBOUNCER_ENABLED: ${PGBOUNCER_ENABLED:-true}
      PGBOUNCER_POOL_MODE: ${PGBOUNCER_POOL_MODE:-transaction}
      REDIS_URL: ${REDIS_URL:-}
      SANDBOX_MAX_CPU: ${SANDBOX_MAX_CPU:-0.5}
      SANDBOX_MAX_MEMORY_MB: ${SANDBOX_MAX_MEMORY_MB:-512}
      PREVIEW_IDLE_TIMEOUT_MS: ${PREVIEW_IDLE_TIMEOUT_MS:-900000}
      PREVIEW_MAX_CONCURRENT_PER_USER: ${PREVIEW_MAX_CONCURRENT_PER_USER:-3}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      COARENA_API_KEY: ${COARENA_API_KEY:-}
    volumes:
      - carmen_data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 3

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      app:
        condition: service_healthy
    environment:
      CARMEN_DOMAIN: ${CARMEN_DOMAIN:-localhost}
      PREVIEW_DOMAIN: ${PREVIEW_DOMAIN:-:8443}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
      - "${PREVIEW_HTTPS_PORT:-8443}:8443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 80 || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3

volumes:
  carmen_data:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
